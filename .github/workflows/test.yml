name: Run Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      COMPLIANCE_PROVIDER: local
      IDENTITY_PROVIDER: local

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        env:
          JWT_SECRET: test-secret
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm test